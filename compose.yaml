services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=rss-yoriyori
      - S3_USE_SSL=false
    depends_on:
      minio-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO起動後にバケットを作成
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/rss-yoriyori --ignore-existing;
      mc anonymous set public myminio/rss-yoriyori;
      exit 0;
      "

  # テスト実行用
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - ${HOST_PROJECT_PATH}/src:/app/src
      - ${HOST_PROJECT_PATH}/test:/app/test
      - ${HOST_PROJECT_PATH}/feeds.json:/app/feeds.json
    environment:
      - MINIO_ENDPOINT=minio:9000
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=rss-yoriyori
      - S3_USE_SSL=false
    depends_on:
      minio-init:
        condition: service_completed_successfully
