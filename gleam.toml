name = "rss_yoriyori"
version = "1.0.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 0.53.0 and < 2.0.0"

# HTTPフレームワーク: ルーティング、リクエスト/レスポンス処理を提供
wisp = ">= 2.1.0 and < 3.0.0"

# HTTPサーバー: wispが動作するための基盤（Erlang/OTPベース）
mist = ">= 5.0.0 and < 6.0.0"

# 環境変数の読み取り: Cloud RunではPORT環境変数でポート指定される
envoy = ">= 1.1.0 and < 2.0.0"

# Erlang連携: プロセス管理やErlang関数呼び出しに必要
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"

# S3互換ストレージクライアント（MinIO/GCS S3互換）
bucket = ">= 1.4.0 and < 2.0.0"
gleam_httpc = ">= 4.0.0 and < 5.0.0"

# RSS/Atomフィード処理
xmlm = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
birl = ">= 1.8.0 and < 2.0.0"

# ファイル読み込み
simplifile = ">= 2.0.0 and < 3.0.0"

[dev-dependencies]
glacier = ">= 1.3.3 and < 2.0.0"
